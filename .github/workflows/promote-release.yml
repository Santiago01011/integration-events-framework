name: Release - Promote Package to Production

on:
  workflow_dispatch:
    inputs:
      version_id:
        description: "Package Version ID to promote (04t...)"
        required: true
        type: string
      release_notes:
        description: "Release notes for the GitHub release"
        required: true
        type: string

concurrency:
  group: promote-release
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SF_SKIP_UPDATE_CHECK: true
      SF_NO_VERSION_CHECK: true
      SF_HIDE_RELEASE_NOTES: true
      SF_HIDE_FOOTER: true
    container:
      image: salesforce/cli:latest-full
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix Git Safe Directory
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Validate Version ID
        run: |
          VERSION_ID="${{ github.event.inputs.version_id }}"

          if [[ ! "$VERSION_ID" =~ ^04t[a-zA-Z0-9]{15}$ ]]; then
            echo "Invalid version ID format: $VERSION_ID"
            echo "Expected format: 04tXXXXXXXXXXXXXXX (18 characters starting with 04t)"
            exit 1
          fi

          echo "Version ID format valid: $VERSION_ID"

      - name: Write JWT Key File
        run: echo "${{ secrets.DEVHUB_SERVER_KEY }}" > server.key

      - name: Authenticate DevHub (JWT)
        run: |
          sf org login jwt \
            --client-id ${{ secrets.DEVHUB_CONSUMER_KEY }} \
            --jwt-key-file server.key \
            --username ${{ secrets.DEVHUB_USERNAME }} \
            --set-default-dev-hub \
            --alias DevHub

      - name: Get Package Version Info
        id: version-info
        run: |
          sf package version report \
            --package "${{ github.event.inputs.version_id }}" \
            --target-dev-hub DevHub \
            --json > version-info.json

          VERSION_NUMBER=$(jq -r '.result.Version' version-info.json)
          IS_RELEASED=$(jq -r '.result.IsReleased' version-info.json)
          PACKAGE2_ID=$(jq -r '.result.Package2Id // empty' version-info.json)
          PACKAGE2_NAME=$(jq -r '.result.Package2Name // empty' version-info.json)
          SUBSCRIBER_VERSION_ID=$(jq -r '.result.SubscriberPackageVersionId // empty' version-info.json)

          echo "version_number=$VERSION_NUMBER" >> $GITHUB_OUTPUT
          echo "is_released=$IS_RELEASED" >> $GITHUB_OUTPUT
          echo "package2_id=$PACKAGE2_ID" >> $GITHUB_OUTPUT
          echo "package2_name=$PACKAGE2_NAME" >> $GITHUB_OUTPUT
          echo "subscriber_version_id=$SUBSCRIBER_VERSION_ID" >> $GITHUB_OUTPUT

          echo "Version Number: $VERSION_NUMBER"
          echo "Is Already Released: $IS_RELEASED"
          echo "Package2 ID: ${PACKAGE2_ID:-n/a}"
          echo "Package2 Name: ${PACKAGE2_NAME:-n/a}"

      - name: Promote Package Version
        run: |
          sf package version promote \
            --package "${{ github.event.inputs.version_id }}" \
            --target-dev-hub DevHub \
            --no-prompt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version-info.outputs.version_number }}
          name: ${{ steps.version-info.outputs.package2_name || 'Package' }} v${{ steps.version-info.outputs.version_number }}
          body: |
            ## Package Release v${{ steps.version-info.outputs.version_number }}

            **Package Version ID**: `${{ github.event.inputs.version_id }}`
            **Package**: `${{ steps.version-info.outputs.package2_name || steps.version-info.outputs.package2_id }}`

            ### Release Notes

            ${{ github.event.inputs.release_notes }}

            ### Installation

            ```bash
            sf package install --package ${{ github.event.inputs.version_id }} --target-org YOUR_ORG --wait 10
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post Summary
        if: success()
        run: |
          echo "## Package Promoted to Production" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ steps.version-info.outputs.version_number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Package ID**: \`${{ github.event.inputs.version_id }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Package**: \`${{ steps.version-info.outputs.package2_name || steps.version-info.outputs.package2_id }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Release Notes" >> $GITHUB_STEP_SUMMARY
          echo "${{ github.event.inputs.release_notes }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installation Command" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "sf package install --package ${{ github.event.inputs.version_id }} --target-org YOUR_ORG --wait 10" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Cleanup
        if: always()
        run: rm -f server.key version-info.json
