name: Release - Promote Package

on:
  push:
    branches: [main]
    paths:
      - "force-app/**"
      - "sfdx-project.json"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create releases
      pull-requests: write # Required to create PRs
    env:
      SF_SKIP_UPDATE_CHECK: true
      SF_NO_VERSION_CHECK: true
      SF_HIDE_RELEASE_NOTES: true
      SF_HIDE_FOOTER: true
    container:
      image: salesforce/cli:latest-full
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix Git Safe Directory
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Install GitHub CLI
        run: |
          # Install GitHub CLI for creating PRs
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          apt update
          apt install -y gh

      - name: Block Direct Push
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Recent commit message: $COMMIT_MSG"

          # Bypass if passkey is present in commit message
          BYPASS_KEY="${{ secrets.CI_BYPASS_KEY }}"
          if [[ -n "$BYPASS_KEY" ]] && [[ "$COMMIT_MSG" == *"$BYPASS_KEY"* ]]; then
            echo "✅ Passkey detected from Secrets. Allowing push."
            exit 0
          fi

          # Check if it's a merge commit (usually has 2 parents)
          PARENTS=$(git log -1 --pretty=%P | wc -w)

          # GitHub squash merges are NOT merge commits in the Git sense (they have 1 parent)
          # but they usually follow a message pattern like 'Title (#PR)'
          if [[ $PARENTS -le 1 ]] && [[ ! "$COMMIT_MSG" =~ \(#[0-9]+\)$ ]]; then
             echo "❌ ERROR: Direct pushes to 'main' are blocked."
             echo "Please use the 'feature -> dev -> main' flow via Pull Requests."
             echo "To bypass, include the valid CI_BYPASS_KEY in your commit message."
             exit 1
          fi
          echo "✅ Verified: Push is via Merge Request or contains reference."

      - name: Write JWT Key File
        run: echo "${{ secrets.DEVHUB_SERVER_KEY }}" > server.key

      - name: Authenticate DevHub (JWT)
        run: |
          sf org login jwt \
            --client-id ${{ secrets.DEVHUB_CONSUMER_KEY }} \
            --jwt-key-file server.key \
            --username ${{ secrets.DEVHUB_USERNAME }} \
            --set-default-dev-hub \
            --alias DevHub

      - name: Create Package Version (Release Candidate)
        id: create-version
        run: |
          sf package version create \
            --package IntegrationLogsFrameworkv2 \
            --installation-key-bypass \
            --wait 20 \
            --code-coverage \
            --target-dev-hub DevHub \
            --json > version-result.json

          VERSION_ID=$(jq -r '.result.SubscriberPackageVersionId' version-result.json)
          echo "version_id=$VERSION_ID" >> $GITHUB_OUTPUT

      - name: Show Package Version Creation Error
        if: failure() && steps.create-version.outcome == 'failure'
        run: |
          echo "Package Version Creation Failed. Output details:"
          cat version-result.json

      - name: Promote Package Version
        run: |
          sf package version promote \
            --package ${{ steps.create-version.outputs.version_id }} \
            --target-dev-hub DevHub \
            --no-prompt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: |
            Package Version ID: `${{ steps.create-version.outputs.version_id }}`

            Install command:
            ```bash
            sf package install --package ${{ steps.create-version.outputs.version_id }} --target-org YOUR_ORG
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump Version & Create PR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure Git
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # Run version bump script
          node scripts/bump-version.js

          # Check if there are changes
          if [[ -n $(git status -s sfdx-project.json) ]]; then
            echo "Creating version bump PR..."
            
            # Extract new version from sfdx-project.json
            NEW_VERSION=$(node -pe "JSON.parse(require('fs').readFileSync('sfdx-project.json')).packageDirectories.find(d => d.default).versionNumber")
            BRANCH_NAME="chore/version-bump-${NEW_VERSION}-$(date +%s)"
            
            # Create and checkout new branch
            git checkout -b "$BRANCH_NAME"
            
            # Stage and commit changes
            git add sfdx-project.json
            git commit -m "chore: bump package version to $NEW_VERSION [skip ci]"
            
            # Push branch using GITHUB_TOKEN
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
            git push origin "$BRANCH_NAME"
            
            # Create PR using GitHub CLI
            gh pr create \
              --base main \
              --head "$BRANCH_NAME" \
              --title "chore: bump package version to $NEW_VERSION" \
              --body "Automated version bump after successful release.

            Package Version ID: \`${{ steps.create-version.outputs.version_id }}\`
            
            This PR was automatically created by the release workflow.
            
            **Note:** This PR can be auto-merged once CI passes." \
              --label "automated" \
              --label "version-bump"
            
            echo "✅ Pull request created for version bump"
          else
            echo "No changes to commit"
          fi

      - name: Cleanup
        if: always()
        run: rm -f server.key version-result.json
