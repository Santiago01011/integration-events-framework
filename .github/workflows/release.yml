name: Release - Promote Package

on:
  push:
    branches: [main]
    paths:
      - "force-app/**"
      - "sfdx-project.json"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create releases
    env:
      SF_SKIP_UPDATE_CHECK: true
      SF_NO_VERSION_CHECK: true
      SF_HIDE_RELEASE_NOTES: true
      SF_HIDE_FOOTER: true
    container:
      image: salesforce/cli:latest-full
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix Git Safe Directory
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Block Direct Push
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Recent commit message: $COMMIT_MSG"

          # Bypass if passkey is present in commit message
          BYPASS_KEY="${{ secrets.CI_BYPASS_KEY }}"
          if [[ -n "$BYPASS_KEY" ]] && [[ "$COMMIT_MSG" == *"$BYPASS_KEY"* ]]; then
            echo "✅ Passkey detected from Secrets. Allowing push."
            exit 0
          fi

          # Check if it's a merge commit (usually has 2 parents)
          PARENTS=$(git log -1 --pretty=%P | wc -w)

          # GitHub squash merges are NOT merge commits in the Git sense (they have 1 parent)
          # but they usually follow a message pattern like 'Title (#PR)'
          if [[ $PARENTS -le 1 ]] && [[ ! "$COMMIT_MSG" =~ \(#[0-9]+\)$ ]]; then
             echo "❌ ERROR: Direct pushes to 'main' are blocked."
             echo "Please use the 'feature -> dev -> main' flow via Pull Requests."
             echo "To bypass, include the valid CI_BYPASS_KEY in your commit message."
             exit 1
          fi
          echo "✅ Verified: Push is via Merge Request or contains reference."

      - name: Write JWT Key File
        run: echo "${{ secrets.DEVHUB_SERVER_KEY }}" > server.key

      - name: Authenticate DevHub (JWT)
        run: |
          sf org login jwt \
            --client-id ${{ secrets.DEVHUB_CONSUMER_KEY }} \
            --jwt-key-file server.key \
            --username ${{ secrets.DEVHUB_USERNAME }} \
            --set-default-dev-hub \
            --alias DevHub

      - name: Create Package Version (Release Candidate)
        id: create-version
        run: |
          sf package version create \
            --package IntegrationLogsFrameworkv2 \
            --installation-key-bypass \
            --wait 20 \
            --code-coverage \
            --target-dev-hub DevHub \
            --json > version-result.json

          VERSION_ID=$(jq -r '.result.SubscriberPackageVersionId' version-result.json)
          echo "version_id=$VERSION_ID" >> $GITHUB_OUTPUT

      - name: Show Package Version Creation Error
        if: failure() && steps.create-version.outcome == 'failure'
        run: |
          echo "Package Version Creation Failed. Output details:"
          cat version-result.json

      - name: Promote Package Version
        run: |
          sf package version promote \
            --package ${{ steps.create-version.outputs.version_id }} \
            --target-dev-hub DevHub \
            --no-prompt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: |
            Package Version ID: `${{ steps.create-version.outputs.version_id }}`

            Install command:
            ```bash
            sf package install --package ${{ steps.create-version.outputs.version_id }} --target-org YOUR_ORG
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump Version & Commit
        shell: bash
        run: |
          # Configure Git
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # Run version bump script
          node scripts/bump-version.js

          # Check if there are changes
          if [[ -n $(git status -s sfdx-project.json) ]]; then
            echo "Committing version bump..."
            git add sfdx-project.json
            git commit -m "chore: bump package version [skip ci]"
            # Use PAT to bypass branch protection
            git remote set-url origin https://x-access-token:${{ secrets.BOT_PAT_TOKEN }}@github.com/${{ github.repository }}
            git push origin HEAD:main
          else
            echo "No changes to commit"
          fi

      - name: Cleanup
        if: always()
        run: rm -f server.key version-result.json
