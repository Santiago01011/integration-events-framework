name: CI - Create Beta Package Version

on:
  push:
    branches: [main]
    paths:
      - "force-app/**"
      - "sfdx-project.json"
  workflow_dispatch: # Allow manual triggering for testing

# Prevent multiple concurrent builds
concurrency:
  group: beta-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-beta:
    runs-on: ubuntu-latest
    env:
      SF_SKIP_UPDATE_CHECK: true
      SF_NO_VERSION_CHECK: true
      SF_HIDE_RELEASE_NOTES: true
      SF_HIDE_FOOTER: true
    container:
      image: salesforce/cli:latest-full
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for [skip ci] in Commit Message
        id: skip-check
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MSG"

          if [[ "$COMMIT_MSG" == *"[skip ci]"* ]]; then
            echo "⏭️  [skip ci] detected - skipping beta package creation"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "✅ Proceeding with beta package creation"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Fix Git Safe Directory
        if: steps.skip-check.outputs.skip != 'true'
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Block Direct Push
        if: steps.skip-check.outputs.skip != 'true'
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Recent commit message: $COMMIT_MSG"

          # Skip for version bump commits (redundant with skip-check, but kept for clarity)
          if [[ "$COMMIT_MSG" == *"[skip ci]"* ]]; then
            echo "⏭️  Skipping direct push check for automated commit"
            exit 0
          fi

          # Bypass if passkey is present in commit message
          BYPASS_KEY="${{ secrets.CI_BYPASS_KEY }}"
          if [[ -n "$BYPASS_KEY" ]] && [[ "$COMMIT_MSG" == *"$BYPASS_KEY"* ]]; then
            echo "✅ Passkey detected from Secrets. Allowing push."
            exit 0
          fi

          # Check if it's a merge commit (usually has 2 parents)
          PARENTS=$(git log -1 --pretty=%P | wc -w)

          # GitHub squash merges are NOT merge commits in the Git sense (they have 1 parent)
          # but they usually follow a message pattern like 'Title (#PR)'
          if [[ $PARENTS -le 1 ]] && [[ ! "$COMMIT_MSG" =~ \(#[0-9]+\)$ ]]; then
             echo "❌ ERROR: Direct pushes to 'main' are blocked."
             echo "Please use the 'feature -> dev -> main' flow via Pull Requests."
             echo "To bypass, include the valid CI_BYPASS_KEY in your commit message."
             exit 1
          fi
          echo "✅ Verified: Push is via Merge Request or contains reference."

      - name: Write JWT Key File
        if: steps.skip-check.outputs.skip != 'true'
        run: echo "${{ secrets.DEVHUB_SERVER_KEY }}" > server.key

      - name: Authenticate DevHub (JWT)
        if: steps.skip-check.outputs.skip != 'true'
        run: |
          sf org login jwt \
            --client-id ${{ secrets.DEVHUB_CONSUMER_KEY }} \
            --jwt-key-file server.key \
            --username ${{ secrets.DEVHUB_USERNAME }} \
            --set-default-dev-hub \
            --alias DevHub

      - name: Create Beta Package Version
        if: steps.skip-check.outputs.skip != 'true'
        id: create-version
        run: |
          echo "📦 Creating BETA package version (not promoted)..."
          sf package version create \
            --package IntegrationLogsFrameworkv2 \
            --installation-key-bypass \
            --wait 20 \
            --code-coverage \
            --target-dev-hub DevHub \
            --json > version-result.json

          VERSION_ID=$(jq -r '.result.SubscriberPackageVersionId' version-result.json)
          VERSION_NUMBER=$(jq -r '.result.Version' version-result.json)

          echo "version_id=$VERSION_ID" >> $GITHUB_OUTPUT
          echo "version_number=$VERSION_NUMBER" >> $GITHUB_OUTPUT

          echo "✅ Beta version created: $VERSION_NUMBER"
          echo "📋 Version ID: $VERSION_ID"
          echo "⚠️  This is a BETA version - not promoted/released"

      - name: Show Package Version Creation Error
        if: failure() && steps.create-version.outcome == 'failure'
        run: |
          echo "❌ Package Version Creation Failed. Output details:"
          cat version-result.json

      - name: Post Summary
        if: success() && steps.skip-check.outputs.skip != 'true'
        run: |
          echo "## 📦 Beta Package Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ steps.create-version.outputs.version_number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Package ID**: \`${{ steps.create-version.outputs.version_id }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **This is a BETA version** - it has NOT been promoted." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To promote this version to production:" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to Actions → **Release - Promote Package**" >> $GITHUB_STEP_SUMMARY
          echo "2. Click **Run workflow**" >> $GITHUB_STEP_SUMMARY
          echo "3. Enter the version ID: \`${{ steps.create-version.outputs.version_id }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Skip Summary
        if: steps.skip-check.outputs.skip == 'true'
        run: |
          echo "## ⏭️ Beta Package Creation Skipped" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Reason**: Commit message contains \`[skip ci]\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This is typically an automated version bump commit." >> $GITHUB_STEP_SUMMARY

      - name: Cleanup
        if: always()
        run: rm -f server.key version-result.json
