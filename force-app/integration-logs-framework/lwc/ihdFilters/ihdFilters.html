<template>
  <lightning-card>
    <div
      class="slds-var-p-horizontal_medium slds-var-p-bottom_medium"
      role="search"
      aria-label="Integration Health Search and Filters"
    >
      <template if:true={isLoading}>
        <lightning-spinner
          alternative-text="Loading"
          size="small"
          variant="brand"
        ></lightning-spinner>
      </template>

      <lightning-layout
        multiple-rows
        vertical-align="end"
        class="slds-var-m-bottom_small"
      >
        <lightning-layout-item flexibility="grow" padding="horizontal-small">
          <lightning-input
            type="search"
            label={labels.IHD_Search_Context}
            value={searchValue}
            onchange={handleSearchChange}
            variant="label-hidden"
            placeholder={labels.IHD_Search_Placeholder}
            aria-label="Search integration logs"
          ></lightning-input>
        </lightning-layout-item>

        <lightning-layout-item flexibility="no-grow" padding="horizontal-small">
          <div
            class="slds-grid slds-grid_vertical-align-center tcp-actions-row"
          >
            <lightning-button-icon
              icon-name={filterIcon}
              variant={filterButtonVariant}
              alternative-text={labels.IHD_Toggle_Filters}
              onclick={handleToggleFilters}
              title="Toggle Filters"
              class="slds-var-m-right_xx-small"
              tooltip="Show/Hide Advanced Filters"
              aria-label="Toggle Advanced Filters"
              aria-expanded={showFilters}
            >
            </lightning-button-icon>

            <lightning-button-icon
              icon-name="utility:refresh"
              variant="border-filled"
              alternative-text={labels.IHD_Refresh_Data}
              title="Refresh"
              onclick={handleRefresh}
              disabled={isLoading}
              aria-label="Refresh Logs"
            >
            </lightning-button-icon>
          </div>
        </lightning-layout-item>
      </lightning-layout>

      <div
        class="slds-var-p-horizontal_small slds-text-body_small slds-text-color_weak"
      >
        <div class="slds-grid slds-grid_align-spread">
          <span>{labels.IHD_Search_Help}</span>
          <span
            >{labels.IHD_Updated}:
            <lightning-formatted-date-time
              value={lastUpdated}
              hour="2-digit"
              minute="2-digit"
            ></lightning-formatted-date-time
          ></span>
        </div>
      </div>

      <template if:true={showFilters}>
        <div
          class="tcp-advanced-filters slds-var-m-top_medium slds-var-p-top_medium slds-border_top"
          role="group"
          aria-label="Advanced Filters"
        >
          <lightning-layout multiple-rows>
            <lightning-layout-item
              size="12"
              large-device-size="2"
              padding="horizontal-small"
              class="slds-var-m-bottom_small"
            >
              <lightning-input
                type="text"
                label={labels.IHD_Correlation_Id}
                value={correlationValue}
                onchange={handleCorrelationChange}
                variant="label-stacked"
                placeholder="Filter ID..."
                aria-label="Correlation ID filter"
              ></lightning-input>
            </lightning-layout-item>

            <lightning-layout-item
              size="6"
              large-device-size="2"
              padding="horizontal-small"
              class="slds-var-m-bottom_small"
            >
              <lightning-combobox
                name="observationType"
                label={labels.IHD_Observation_Type}
                value={observationValue}
                options={observationOptions}
                onchange={handleObservationChange}
                variant="label-stacked"
                aria-label="Observation type filter"
              ></lightning-combobox>
            </lightning-layout-item>

            <lightning-layout-item
              size="6"
              large-device-size="2"
              padding="horizontal-small"
              class="slds-var-m-bottom_small"
            >
              <lightning-combobox
                name="integrationCode"
                label={labels.IHD_Integration_Code}
                value={integrationCodeValue}
                options={integrationOptions}
                onchange={handleIntegrationChange}
                variant="label-stacked"
                aria-label="Integration code filter"
              ></lightning-combobox>
            </lightning-layout-item>

            <lightning-layout-item
              size="12"
              large-device-size="3"
              padding="horizontal-small"
              class="slds-var-m-bottom_small"
            >
              <span class="slds-form-element__label" id="from-datetime-label"
                >{labels.IHD_From}</span
              >
              <div
                class="tcp-datetime-group"
                aria-labelledby="from-datetime-label"
              >
                <div class="tcp-date-input">
                  <lightning-input
                    type="date"
                    variant="label-hidden"
                    label="From Date"
                    value={fromDate}
                    onchange={handleFromDateChange}
                    aria-label="From date"
                  >
                  </lightning-input>
                </div>
                <div class="tcp-time-input">
                  <c-time-clock-picker
                    label="From Time"
                    variant="label-hidden"
                    value={fromTime}
                    onchange={handleFromTimeChange}
                    hour-mode="12"
                  >
                  </c-time-clock-picker>
                </div>
              </div>
            </lightning-layout-item>

            <lightning-layout-item
              size="12"
              large-device-size="3"
              padding="horizontal-small"
              class="slds-var-m-bottom_small"
            >
              <span class="slds-form-element__label" id="to-datetime-label"
                >{labels.IHD_To}</span
              >
              <div
                class="tcp-datetime-group"
                aria-labelledby="to-datetime-label"
              >
                <div class="tcp-date-input">
                  <lightning-input
                    type="date"
                    variant="label-hidden"
                    label="To Date"
                    value={toDate}
                    onchange={handleToDateChange}
                    aria-label="To date"
                  >
                  </lightning-input>
                </div>
                <div class="tcp-time-input">
                  <c-time-clock-picker
                    label="To Time"
                    variant="label-hidden"
                    value={toTime}
                    onchange={handleToTimeChange}
                    hour-mode="12"
                  >
                  </c-time-clock-picker>
                </div>
              </div>
            </lightning-layout-item>
          </lightning-layout>

          <div
            class="slds-grid slds-grid_align-end slds-var-p-horizontal_small slds-var-m-top_x-small"
          >
            <lightning-button
              label={labels.IHD_Clear_All_Filters}
              onclick={handleClearFilters}
              variant="neutral"
              aria-label="Clear all filters"
            >
            </lightning-button>
          </div>
        </div>
      </template>
    </div>
  </lightning-card>
</template>
