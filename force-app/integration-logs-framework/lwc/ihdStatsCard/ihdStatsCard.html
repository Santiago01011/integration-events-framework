<template>
    <div class="slds-box slds-box_link" onclick={handleCardClick}>
        <h2 class="slds-text-heading_medium slds-m-bottom_small">{title}</h2>
                <!-- Progress Bar Section -->
                <div class="slds-m-bottom_medium">
                    <div class="slds-grid slds-grid_align-spread slds-text-body_small slds-m-bottom_x-small">
                        <span>
                            <span class="slds-text-color_success">{successLabel} ({successPercentage}%)</span>
                            <span class="slds-m-left_small slds-text-color_error">{errorLabel} ({errorPercentage}%)</span>
                        </span>
                    </div>
                    <c-progress-bar
                        success-percentage={successPercentage}
                        error-percentage={errorPercentage}>
                    </c-progress-bar>
                </div>

                <!-- Stats List -->
                <ul class="slds-list_vertical slds-has-dividers_bottom-space">
                    <template for:each={stats} for:item="stat">
                        <li key={stat.id} class="slds-item">
                            <div class="slds-grid slds-grid_align-spread">
                                <span class="slds-text-color_weak">{stat.label}:</span>
                                <template if:true={stat.isDateTime}>
                                    <lightning-formatted-date-time
                                        value={stat.value}
                                        year="numeric" month="numeric" day="numeric"
                                        hour="2-digit" minute="2-digit">
                                    </lightning-formatted-date-time>
                                </template>
                                <template if:false={stat.isDateTime}>
                                    <template if:true={stat.badgeTheme}>
                                        <span class={stat.badgeClass}>{stat.value}</span>
                                    </template>
                                    <template if:false={stat.badgeTheme}>
                                        <span>{stat.value}</span>
                                    </template>
                                </template>
                            </div>
                        </li>
                    </template>
                </ul>
            </div>
</template>
