<template>
  <div
    class={containerClass}
    onclick={handleCardClick}
    onkeydown={handleKeyDown}
    tabindex="0"
    role="button"
    aria-label={title}
  >
    <!-- Large Variant: Detailed Stats with Progress Bar -->
    <template if:true={isLarge}>
      <div class="card-header">
        <h2 class="card-title">{title}</h2>
      </div>
      <div class="card-body">
        <div class="progress-section">
          <div class="progress-labels">
            <span class="label-success"
              >{successLabel} ({successPercentage}%)</span
            >
            <span class="label-error">{errorLabel} ({errorPercentage}%)</span>
          </div>
          <c-progress-bar
            success-percentage={successPercentage}
            error-percentage={errorPercentage}
          >
          </c-progress-bar>
        </div>

        <ul class="stats-list">
          <template for:each={stats} for:item="stat">
            <li key={stat.id} class="stat-item">
              <div class="stat-content">
                <span class="stat-label">{stat.label}:</span>
                <template if:true={stat.isDateTime}>
                  <lightning-formatted-date-time
                    value={stat.value}
                    year="numeric"
                    month="numeric"
                    day="numeric"
                    hour="2-digit"
                    minute="2-digit"
                  >
                  </lightning-formatted-date-time>
                </template>
                <template if:false={stat.isDateTime}>
                  <template if:true={stat.badgeTheme}>
                    <span class={stat.badgeClass}>{stat.value}</span>
                  </template>
                  <template if:false={stat.badgeTheme}>
                    <span class="stat-value">{stat.value}</span>
                  </template>
                </template>
              </div>
            </li>
          </template>
        </ul>
      </div>
    </template>

    <!-- Small Variant: Compact Tile -->
    <template if:true={isSmall}>
      <div class={labelClass}>{title}</div>
      <div class="tile-value">{value}</div>
    </template>
  </div>
</template>
