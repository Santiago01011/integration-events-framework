<template>
    <div class="tcp-container" onkeydown={handleKeydown}>
        <button
            class="tcp-trigger"
            type="button"
            aria-haspopup="dialog"
            aria-expanded={showPopover}
            onclick={togglePopover}
        >
            <span class="tcp-trigger-label">{displayValue}</span>
            <span class="tcp-trigger-icon" aria-hidden="true">🕒</span>
        </button>
        <template if:true={showPopover}>
            <section class="tcp-popover" role="dialog" aria-modal="true">
                <header class="tcp-header">
                    <div>
                        <p class="tcp-stage">{stageLabel}</p>
                        <p class="tcp-value">{displayValue}</p>
                    </div>
                    <button class="tcp-close" type="button" aria-label="Close picker" onclick={closePopover}>×</button>
                </header>
                <template if:true={is12HourMode}>
                    <div class="tcp-meridian-toggle">
                        <button type="button" class={amButtonClass} data-value="AM" onclick={handleMeridianToggle}>AM</button>
                        <button type="button" class={pmButtonClass} data-value="PM" onclick={handleMeridianToggle}>PM</button>
                    </div>
                </template>
                <div class="tcp-body">
                    <div class="tcp-face" role="application" aria-label="Clock face">
                        <template for:each={numbers} for:item="node">
                            <button
                                key={node.value}
                                class={node.className}
                                style={node.style}
                                data-value={node.value}
                                type="button"
                                onclick={handleFaceClick}
                            >
                                {node.label}
                            </button>
                        </template>
                        <div class="tcp-hand" style={handStyle}></div>
                    </div>
                </div>
                <footer class="tcp-footer">
                    <button class="tcp-link" type="button" onclick={setNow}>Now</button>
                    <button class="tcp-link" type="button" onclick={clearValue}>Clear</button>
                    <button class="tcp-primary" type="button" onclick={apply}>Apply</button>
                </footer>
            </section>
        </template>
    </div>
</template>
