<template>
    <lightning-tabset
        template:ref="tabset"
        variant="scoped"
        active-tab-value={activeTab}
        onselect={handleTabSelect}>
        <!-- Header Section -->
        <lightning-tab label="Resumen" value="summary">
            <div class="slds-m-around_medium">
                <div class="slds-box slds-theme_default">
                    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                        <div>
                            <h2 class="slds-text-heading_medium slds-m-bottom_xx-small">Integration Activity</h2>
                            <p class="slds-text-body_regular">Total Events: <strong>{totalEvents}</strong></p>
                        </div>
                        <div class="slds-text-align_right">
                            <p class="slds-text-body_small slds-text-color_weak">Last Updated: {lastUpdated}</p>
                        </div>
                    </div>
                </div>
            </div>
            <c-last-updated-footer
                last-updated={lastUpdated}
                is-loading={isLoading}
                onrefresh={handleRefresh}
            ></c-last-updated-footer>
        </lightning-tab>


        <!-- Integration Summary Cards -->
        <lightning-tab label="Resumenes por integración" value="integrations">
            <template if:true={summariesData}>
                <div class="slds-grid slds-wrap slds-gutters slds-p-around_medium">
                        <template for:each={summariesData} for:item="summary">
                        <div key={summary.integrationCode} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-3 slds-p-bottom_medium">
                            <c-ihd-integration-summary-card
                                summary={summary}
                                        max-events={maxSummaryEvents}
                                oncardclick={handleIntegrationCardClick}
                            ></c-ihd-integration-summary-card>
                        </div>
                    </template>
                </div>
            </template>
                <template if:true={summariesError}>
                <div class="slds-text-align_center slds-p-around_medium">
                    <p>There was an error loading the integration summaries.</p>
                </div>
            </template>
            <template if:false={initialLoadDone}>
                <div class="slds-is-relative" style="height: 10rem;">
                    <lightning-spinner alternative-text="Loading"></lightning-spinner>
                </div>
            </template>
            <c-last-updated-footer
                last-updated={lastUpdated}
                is-loading={isLoading}
                onrefresh={handleRefresh}
            ></c-last-updated-footer>
        </lightning-tab>

        <!-- Filters Section -->
        <lightning-tab label="Filters" value="filters">
            <div class="slds-m-around_medium">
                <c-ihd-filters
                    search-value={searchValue}
                    observation-value={observationType}
                    integration-code-value={integrationCode}
                    correlation-value={correlationId}
                    from-value={fromOccurredAt}
                    to-value={toOccurredAt}
                    last-updated={lastUpdated}
                    is-loading={isLoading}
                    onfilterschanged={handleFiltersChanged}
                    onrefresh={handleRefresh}
                ></c-ihd-filters>
                <div class="slds-m-top_medium">
                    <c-ihd-table
                        rows={rows}
                        columns={columns}
                        is-loading={isLoading}
                        enable-infinite-loading={hasMore}
                        onloadmore={handleLoadMoreData}
                        onrowaction={handleRowAction}>
                    </c-ihd-table>
                </div>
            </div>
            <!-- Detail Drawer -->
            <c-ihd-detail-drawer
                visible={showDetailDrawer}
                record={selectedRecord}
                onclose={handleCloseDetailDrawer}
            ></c-ihd-detail-drawer>
        </lightning-tab>

    </lightning-tabset>



    <div class="slds-text-align_center slds-m-top_large">
        <p class="slds-text-body_small slds-text-color_weak">Version 1.1.1.4</p>
    </div>
</template>
