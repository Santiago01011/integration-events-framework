<template>
  <div
    class="slds-var-m-top_medium slds-var-p-around_small slds-box slds-theme_shade"
  >
    <div
      class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread"
    >
      <template if:true={lastUpdated}>
        <div class="slds-grid slds-grid_vertical-align-center">
          <lightning-icon
            icon-name="utility:clock"
            size="x-small"
            class="slds-var-m-right_x-small"
            alternative-text="Clock"
          ></lightning-icon>
          <span class="slds-text-body_small slds-text-color_weak"
            >{labels.IHD_Last_Updated}:
            <lightning-formatted-date-time
              value={lastUpdated}
              day="2-digit"
              month="2-digit"
              year="numeric"
              hour="2-digit"
              minute="2-digit"
            >
            </lightning-formatted-date-time>
          </span>
        </div>
      </template>
      <div class="slds-is-relative refresh-button">
        <template if:true={isLoading}>
          <lightning-spinner
            size="small"
            alternative-text={labels.IHD_Refresh_Data}
          ></lightning-spinner>
        </template>
        <template if:false={isLoading}>
          <lightning-button-icon
            icon-name="utility:refresh"
            alternative-text={labels.IHD_Refresh_Data}
            title={labels.IHD_Refresh_Data}
            onclick={handleRefresh}
            disabled={isLoading}
            aria-label="Refresh data"
          >
          </lightning-button-icon>
        </template>
      </div>
    </div>
  </div>
</template>
