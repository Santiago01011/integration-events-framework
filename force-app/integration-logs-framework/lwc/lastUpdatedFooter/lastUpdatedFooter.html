<template>
    <div class="footer-container">
        <template if:true={lastUpdated}>
            <div class="last-updated-section">
                <lightning-icon icon-name="utility:clock" size="x-small" class="update-icon"></lightning-icon>
                <span class="update-text">Last updated:</span>
                <lightning-formatted-date-time
                    value={lastUpdated}
                    day="2-digit"
                    month="2-digit"
                    year="numeric"
                    hour="2-digit"
                    minute="2-digit"
                    class="timestamp">
                </lightning-formatted-date-time>
                <template if:true={isStale}>
                    <lightning-badge label={staleLabel} variant="warning" class="stale-badge"></lightning-badge>
                </template>
            </div>
        </template>
        <lightning-button-icon
            icon-name="utility:refresh"
            alternative-text="Refresh data"
            title="Refresh data"
            onclick={handleRefresh}
            disabled={isLoading}
            class="refresh-button">
        </lightning-button-icon>
    </div>
</template>
