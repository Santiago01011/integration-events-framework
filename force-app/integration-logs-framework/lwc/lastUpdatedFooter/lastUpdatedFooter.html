<template>
    <div class="footer-container">
        <template if:true={lastUpdated}>
            <div class="footer-content">
                <lightning-icon icon-name="utility:clock" size="x-small" class="footer-icon"></lightning-icon>
                <span class="footer-text">
                    Last updated: <lightning-formatted-date-time
                        value={lastUpdated}
                        day="2-digit"
                        month="2-digit"
                        year="numeric"
                        hour="2-digit"
                        minute="2-digit">
                    </lightning-formatted-date-time>
                </span>
            </div>
        </template>
        <lightning-button-icon
            icon-name="utility:refresh"
            alternative-text="Refresh data"
            title="Refresh data"
            onclick={handleRefresh}
            disabled={isLoading}
            class="refresh-button">
        </lightning-button-icon>
    </div>
</template>
