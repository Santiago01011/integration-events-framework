<template>
    <div class="slds-box slds-theme_default slds-p-around_none table-container">
        <template if:true={isLoading}>
            <div class="slds-p-around_large slds-align_absolute-center">
                <lightning-spinner alternative-text="Loading" size="medium" variant="brand"></lightning-spinner>
            </div>
        </template>

        <template if:false={isLoading}>
            <template if:true={hasRows}>
                <div class="datatable-wrapper">
                    <lightning-datatable
                        key-field="Id"
                        data={displayRows}
                        columns={columns}
                        hide-checkbox-column
                        show-row-number-column
                        enable-infinite-loading={hasMore}
                        onloadmore={handleLoadMore}
                        onrowaction={handleRowAction}
                        column-widths-mode="auto">
                    </lightning-datatable>
                </div>
            </template>

            <template if:false={hasRows}>
                <div class="slds-text-align_center slds-p-vertical_xx-large slds-text-color_weak">
                    <lightning-icon icon-name="utility:search" size="large" variant="light" class="slds-m-bottom_medium"></lightning-icon>
                    <p class="slds-text-heading_small slds-m-bottom_small">No logs found</p>
                    <p class="slds-text-body_small">Try adjusting your filters or search criteria</p>
                </div>
            </template>
        </template>
    </div>
</template>
