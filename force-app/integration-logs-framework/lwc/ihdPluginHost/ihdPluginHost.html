<template>
  <template if:true={hasPlugin}>
    <div class="slds-card fallback-card">
      <div
        class="slds-card__header slds-grid slds-grid_align-spread slds-grid_vertical-align-center"
      >
        <div class="slds-media slds-media_center slds-has-flexi-truncate">
          <div class="slds-media__figure">
            <lightning-icon
              icon-name="utility:plugin"
              size="small"
              alternative-text="Plugin"
            ></lightning-icon>
          </div>
          <div class="slds-media__body">
            <h2 class="slds-card__header-title slds-truncate">{plugin.name}</h2>
          </div>
        </div>
        <span class="slds-badge slds-badge_neutral">Unregistered</span>
      </div>
      <div
        class="slds-card__body slds-var-p-horizontal_medium slds-var-p-bottom_medium"
      >
        <template if:true={plugin.description}>
          <p
            class="slds-text-body_regular slds-text-color_weak slds-var-m-bottom_small"
          >
            {plugin.description}
          </p>
        </template>
        <p
          class="slds-text-body_small slds-text-color_weak slds-var-m-bottom_small"
        >
          Component: <code>{pluginName}</code>
        </p>
        <template if:true={hasDataPreview}>
          <div class="fallback-data-preview">
            <p class="slds-text-title_caps slds-var-m-bottom_xx-small">
              Plugin Data
            </p>
            <template if:true={isDataObject}>
              <dl class="fallback-data-list">
                <template for:each={dataEntries} for:item="entry">
                  <div key={entry.key} class="fallback-data-row">
                    <dt class="fallback-data-key">{entry.key}</dt>
                    <dd class="fallback-data-value">{entry.value}</dd>
                  </div>
                </template>
              </dl>
            </template>
            <template if:false={isDataObject}>
              <pre class="fallback-data-raw">{pluginDataFormatted}</pre>
            </template>
          </div>
        </template>
        <template if:false={hasDataPreview}>
          <p class="slds-text-body_small slds-text-color_weak">
            No data returned by this plugin.
          </p>
        </template>
      </div>
    </div>
  </template>
</template>
