<template>
    <template if:true={visible}>
        <div class="slds-backdrop slds-backdrop_open"></div>
        <section class="slds-modal slds-fade-in-open slds-modal_large" role="dialog" aria-modal="true">
            <div class="slds-modal__container">
                <header class="slds-modal__header slds-theme_shade">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleClose}>
                        <lightning-icon icon-name="utility:close" size="medium"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 class="slds-text-heading_medium slds-m-bottom_none slds-grid slds-grid_vertical-align-center">
                        <lightning-icon icon-name="standard:log_a_call" size="small" class="slds-m-right_x-small"></lightning-icon>
                        {log.Normalized_Context__c}
                        <span class={badgeClass}>{log.ObservationType__c}</span>
                    </h2>
                </header>
                <div class="slds-modal__content slds-var-p-around_large">
                    <lightning-layout horizontal-align="space" class="slds-var-m-bottom_large">
                        <lightning-layout-item size="6" padding="horizontal-medium">
                            <p class="slds-text-title_bold slds-text-uppercase slds-var-m-bottom_x-small">Occurred At</p>
                            <lightning-formatted-date-time
                                value={log.OccurredAt__c}
                                day="2-digit"
                                month="2-digit"
                                year="numeric"
                                hour="2-digit"
                                minute="2-digit"
                                second="2-digit"
                                time-zone-name="short">
                            </lightning-formatted-date-time>
                        </lightning-layout-item>
                        <lightning-layout-item size="6" padding="horizontal-medium">
                            <p class="slds-text-title_bold slds-text-uppercase slds-var-m-bottom_x-small">Integration Code</p>
                            <lightning-formatted-text value={log.IntegrationCode__c}></lightning-formatted-text>
                        </lightning-layout-item>
                    </lightning-layout>

                    <div class="slds-border_top slds-var-p-top_large slds-var-m-bottom_large">
                        <lightning-layout horizontal-align="space">
                            <lightning-layout-item size="6" padding="horizontal-medium" class="slds-var-m-bottom_medium">
                                <p class="slds-text-title_bold slds-text-uppercase slds-var-m-bottom_x-small">Observation Type</p>
                                <lightning-formatted-text value={log.ObservationType__c}></lightning-formatted-text>
                            </lightning-layout-item>
                            <lightning-layout-item size="6" padding="horizontal-medium" class="slds-var-m-bottom_medium">
                                <p class="slds-text-title_bold slds-text-uppercase slds-var-m-bottom_x-small">Correlation Id</p>
                                <lightning-formatted-text value={log.CorrelationId__c}></lightning-formatted-text>
                            </lightning-layout-item>
                        </lightning-layout>
                        <lightning-layout horizontal-align="space" class="slds-var-m-top_medium">
                            <lightning-layout-item size="6" padding="horizontal-medium" class="slds-var-m-bottom_medium">
                                <p class="slds-text-title_bold slds-text-uppercase slds-var-m-bottom_x-small">Parent Event Id</p>
                                <lightning-formatted-text value={log.ParentEventId__c}></lightning-formatted-text>
                            </lightning-layout-item>
                        </lightning-layout>
                    </div>

                    <div class="slds-border_top slds-var-p-top_large">
                        <p class="slds-text-title_bold slds-text-uppercase slds-var-m-bottom_x-small">Context</p>
                        <lightning-formatted-text value={log.Context__c}></lightning-formatted-text>
                    </div>
                </div>
                <footer class="slds-modal__footer slds-theme_shade slds-grid slds-grid_align-end">
                    <lightning-button
                        label="Close"
                        variant="neutral"
                        onclick={handleClose}
                        class="slds-var-m-right_small"
                    ></lightning-button>
                </footer>
            </div>
        </section>
    </template>
</template>
