<template>
  <template if:true={visible}>
    <div class="slds-backdrop slds-backdrop_open"></div>
    <section
      class="slds-modal slds-fade-in-open slds-modal_medium"
      role="dialog"
      aria-modal="true"
      onkeydown={handleKeyDown}
      tabindex="-1"
    >
      <div class="slds-modal__container">
        <header class="slds-modal__header slds-text-align_left custom-header">
          <div class="slds-media slds-media_center">
            <div class="slds-media__figure">
              <div class="header-icon-container">
                <lightning-icon
                  icon-name="standard:code_playground"
                  size="medium"
                  alternative-text="Integration Log"
                ></lightning-icon>
              </div>
            </div>
            <div class="slds-media__body">
              <div class="slds-grid slds-grid_vertical-align-center">
                <h2
                  class="slds-text-heading_medium slds-var-m-right_small font-bold"
                >
                  Integration: {log.IntegrationCode__c}
                </h2>
                <span class={badgeClass}>{log.ObservationType__c}</span>
              </div>
              <p class="slds-text-body_small slds-text-color_inverse-weak">
                LOG ID: {log.Id}
              </p>
            </div>
          </div>
        </header>

        <div
          class="slds-modal__content slds-var-p-around_medium custom-scrollbar bg-gray"
        >
          <div class="detail-card slds-var-m-bottom_medium">
            <div class="card-header">
              <h3 class="card-title">{labels.IHD_General_Information}</h3>
            </div>
            <div class="slds-var-p-around_medium">
              <div class="slds-grid slds-wrap slds-gutters_small">
                <div class="slds-col slds-size_1-of-2 slds-var-p-bottom_small">
                  <p class="field-label">{labels.IHD_Occurred_At}</p>
                  <div class="field-value">
                    <lightning-icon
                      icon-name="utility:clock"
                      size="xx-small"
                      class="slds-var-m-right_xx-small text-gray"
                      alternative-text="Time"
                    ></lightning-icon>
                    <lightning-formatted-date-time
                      value={log.OccurredAt__c}
                      year="numeric"
                      month="2-digit"
                      day="2-digit"
                      hour="2-digit"
                      minute="2-digit"
                      second="2-digit"
                    >
                    </lightning-formatted-date-time>
                  </div>
                </div>
                <div class="slds-col slds-size_1-of-2 slds-var-p-bottom_small">
                  <p class="field-label">{labels.IHD_Integration_Code}</p>
                  <div class="field-value code-font-light">
                    &lt;&gt; {log.IntegrationCode__c}
                  </div>
                </div>

                <div class="slds-col slds-size_1-of-2">
                  <p class="field-label">{labels.IHD_Observation_Type}</p>
                  <div class="field-value font-semibold">
                    {log.ObservationType__c}
                  </div>
                </div>
                <div class="slds-col slds-size_1-of-2">
                  <p class="field-label">{labels.IHD_Correlation_Id}</p>
                  <div class="field-value text-blue">
                    {log.CorrelationId__c}
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="detail-card">
            <lightning-accordion
              allow-multiple-sections-open
              active-section-name="Payload"
            >
              <lightning-accordion-section
                name="Payload"
                label={labels.IHD_Log_Payload}
              >
                <div class="slds-is-relative">
                  <div class="copy-button-container">
                    <lightning-button
                      label={labels.IHD_Copy_JSON}
                      icon-name="utility:copy"
                      variant="neutral"
                      class="copy-btn"
                      onclick={handleCopy}
                    >
                    </lightning-button>
                  </div>
                  <div class="code-editor-container">
                    <pre class="code-content">{formattedContext}</pre>
                  </div>
                </div>
              </lightning-accordion-section>
            </lightning-accordion>
          </div>
        </div>

        <footer class="slds-modal__footer">
          <lightning-button
            label={labels.IHD_Close}
            onclick={handleClose}
            variant="neutral"
          ></lightning-button>
        </footer>
      </div>
    </section>
  </template>
</template>
