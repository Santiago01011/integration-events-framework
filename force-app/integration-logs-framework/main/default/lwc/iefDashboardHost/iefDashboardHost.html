<template>
  <lightning-card title="Integration Dashboard">
    <!-- Loading spinner -->
    <template if:true={isLoading}>
      <lightning-spinner
        alternative-text="Loading plugins"
        size="small"
      ></lightning-spinner>
    </template>

    <!-- Active plugin cards -->
    <template if:true={hasCards}>
      <div class="slds-grid slds-wrap slds-gutters">
        <template for:each={cardEntries} for:item="entry">
          <div
            key={entry.name}
            class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-3 slds-m-bottom_medium"
          >
            <template if:true={entry.hasCtor}>
              <lwc:component
                lwc:is={entry.ctor}
                context-data={entry.contextData}
              ></lwc:component>
            </template>
            <template if:false={entry.hasCtor}>
              <c-ief-card-placeholder
                plugin-label={entry.label}
                plugin-name={entry.name}
              ></c-ief-card-placeholder>
            </template>
          </div>
        </template>
      </div>
    </template>

    <!-- Empty state -->
    <template if:true={showEmptyState}>
      <c-ief-card-placeholder
        plugin-label={emptyStateLabel}
        plugin-name=""
      ></c-ief-card-placeholder>
    </template>
  </lightning-card>
</template>
