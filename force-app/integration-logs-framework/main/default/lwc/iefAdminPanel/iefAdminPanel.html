<template>
  <!-- Integration Registry Section -->
  <lightning-card
    title={labels.IEF_Integration_Registry}
    icon-name="standard:data_mapping"
  >
    <div slot="actions">
      <lightning-button
        label={labels.IEF_Open_Setup}
        icon-name="utility:new_window"
        onclick={handleOpenSetup}
        class="slds-var-m-right_x-small"
      >
      </lightning-button>
      <lightning-button-icon
        icon-name="utility:refresh"
        alternative-text={labels.IEF_Refresh}
        title="Refresh"
        onclick={handleRefresh}
        aria-label="Refresh Registry Data"
      >
      </lightning-button-icon>
    </div>

    <div class="slds-var-p-horizontal_medium">
      <!-- Registration Progress Bar -->
      <div class="slds-var-m-bottom_medium slds-var-p-horizontal_small">
        <div
          class="slds-grid slds-grid_align-spread slds-var-m-bottom_xx-small"
        >
          <span class="slds-text-body_small slds-text-color_weak"
            >{labels.IEF_Registration_Coverage}</span
          >
          <span class="slds-text-body_small slds-text-color_weak"
            >{registrationPercentage}%</span
          >
        </div>
        <c-ief-progress-bar
          success-percentage={registrationPercentage}
          error-percentage={unregisteredPercentage}
        >
        </c-ief-progress-bar>
      </div>

      <!-- Interactive Filter Tiles -->
      <div
        class="slds-grid slds-wrap slds-gutters_small slds-var-m-bottom_medium"
      >
        <div class="slds-col slds-size_1-of-3">
          <c-ief-stats-card
            variant="small"
            title={labels.IEF_Total}
            value={totalCount}
            is-selected={isAllSelected}
            onclick={handleFilterSelection}
            data-type="all"
          >
          </c-ief-stats-card>
        </div>
        <div class="slds-col slds-size_1-of-3">
          <c-ief-stats-card
            variant="small"
            title={labels.IEF_Registered}
            value={registeredCount}
            label-theme="success"
            is-selected={isRegisteredSelected}
            onclick={handleFilterSelection}
            data-type="registered"
          >
          </c-ief-stats-card>
        </div>
        <div class="slds-col slds-size_1-of-3">
          <c-ief-stats-card
            variant="small"
            title={labels.IEF_Unregistered}
            value={unregisteredCount}
            label-theme="error"
            is-selected={isUnregisteredSelected}
            onclick={handleFilterSelection}
            data-type="unregistered"
          >
          </c-ief-stats-card>
        </div>
      </div>

      <!-- Info Message for Unregistered using standard scoped notification -->
      <template if:true={hasUnregistered}>
        <div
          class="slds-scoped-notification slds-media slds-media_center slds-theme_warning slds-var-m-bottom_medium"
          role="status"
        >
          <div class="slds-media__figure">
            <lightning-icon
              icon-name="utility:warning"
              alternative-text="Warning"
              size="small"
            ></lightning-icon>
          </div>
          <div class="slds-media__body">
            <p>{labels.IEF_Unregistered_Warning}</p>
          </div>
        </div>
      </template>

      <!-- Data Table with Registry Info -->
      <div class="slds-var-m-bottom_medium">
        <c-ief-table
          key-field="integrationCode"
          rows={filteredData}
          columns={columns}
          is-loading={isLoading}
          onrowaction={handleRowAction}
          no-data-message={labels.IEF_No_Integrations_Found}
        >
        </c-ief-table>
      </div>

      <!-- Help Text using standard illustration pattern -->
      <div
        class="slds-var-m-top_medium slds-var-p-around_small slds-box slds-theme_shade"
      >
        <div class="slds-grid slds-grid_vertical-align-center">
          <lightning-icon
            icon-name="utility:info"
            size="x-small"
            class="slds-var-m-right_x-small"
            alternative-text="Info"
          ></lightning-icon>
          <span class="slds-text-body_small"
            >{labels.IEF_Register_Update_Help}</span
          >
        </div>
      </div>
    </div>
  </lightning-card>

  <!-- Plugin Registry Section -->
  <lightning-card
    title="Plugin Registry"
    icon-name="standard:custom_component_task"
    class="slds-var-m-bottom_medium"
  >
    <div slot="actions">
      <lightning-button-icon
        icon-name="utility:refresh"
        alternative-text="Refresh plugins"
        title="Refresh"
        onclick={handleRefreshPlugins}
        aria-label="Refresh Plugin Data"
      >
      </lightning-button-icon>
    </div>

    <div class="slds-var-p-horizontal_medium">
      <template if:true={plugins.length}>
        <div class="slds-var-m-bottom_small">
          <span class="slds-text-body_small slds-text-color_weak">
            {registeredPluginCount} registered plugin(s)
          </span>
        </div>
        <div class="slds-box slds-p-around_none">
          <template for:each={plugins} for:item="plugin">
            <div
              key={plugin.developerName}
              class="slds-grid slds-wrap slds-border_bottom slds-p-around_small slds-p-horizontal_medium"
            >
              <div
                class="slds-col slds-size_1-of-1 slds-medium-size_3-of-6 slds-m-bottom_x-small"
              >
                <div class="slds-text-title_caps slds-text-color_weak">
                  {plugin.label}
                </div>
                <div class="slds-m-top_xx-small">
                  <template if:true={plugin.description}>
                    <span class="slds-text-body_small slds-text-color_weak">
                      {plugin.description}
                    </span>
                  </template>
                  <template if:false={plugin.description}>
                    <span
                      class="slds-text-body_small slds-text-color_weak slds-text-font-style-italic"
                    >
                      No description
                    </span>
                  </template>
                </div>
              </div>
              <div
                class="slds-col slds-size_1-of-1 slds-medium-size_2-of-6 slds-m-bottom_x-small"
              >
                <lightning-badge
                  label={plugin.pluginType}
                  class="slds-badge slds-m-right_xx-small"
                ></lightning-badge>
                <template if:true={plugin.enabled}>
                  <lightning-badge
                    label="Enabled"
                    class="slds-badge slds-badge_success"
                  ></lightning-badge>
                </template>
                <template if:false={plugin.enabled}>
                  <lightning-badge
                    label="Disabled"
                    class="slds-badge slds-badge_warning"
                  ></lightning-badge>
                </template>
              </div>
              <div
                class="slds-col slds-size_1-of-1 slds-medium-size_1-of-6 slds-m-bottom_x-small"
              >
                <div class="slds-text-body_small slds-text-color_weak">
                  <template if:true={plugin.apexClassName}>
                    <div title={plugin.apexClassName}>
                      {plugin.apexClassName}
                    </div>
                  </template>
                  <template if:true={plugin.lwcComponentName}>
                    <div title={plugin.lwcComponentName}>
                      {plugin.lwcComponentName}
                    </div>
                  </template>
                </div>
                <lightning-button
                  variant={plugin.toggleVariant}
                  label={plugin.toggleLabel}
                  title={plugin.toggleTitle}
                  icon-name={plugin.toggleIcon}
                  data-name={plugin.developerName}
                  data-enabled={plugin.enabled}
                  onclick={handleTogglePlugin}
                  class="slds-m-top_xx-small"
                ></lightning-button>
              </div>
            </div>
          </template>
        </div>
        <div
          class="slds-text-body_small slds-text-color_weak slds-m-top_x-small slds-p-horizontal_small"
        >
          Toggle plugins using the buttons above. Changes deploy via Metadata
          API and take effect within seconds.
        </div>
      </template>
      <template if:false={plugins.length}>
        <div class="slds-align_absolute-center slds-p-around_large">
          <template if:true={pluginsLoading}>
            <lightning-spinner size="small"></lightning-spinner>
          </template>
          <template if:false={pluginsLoading}>
            <span class="slds-text-color_weak">No plugins registered.</span>
          </template>
        </div>
      </template>
    </div>
  </lightning-card>

  <!-- Registration / Edit Modal — SLDS standard pattern -->
  <template if:true={showEditModal}>
    <section
      role="dialog"
      tabindex="-1"
      aria-modal="true"
      aria-labelledby="modal-heading"
      class="slds-modal slds-fade-in-open"
    >
      <div class="slds-modal__container">
        <header class="slds-modal__header">
          <button
            class="slds-modal__close slds-button_icon-inverse"
            title="Close"
            onclick={handleCloseModal}
            aria-label="Close modal"
          >
            <lightning-icon
              icon-name="utility:close"
              alternative-text="Close"
              size="small"
              class="slds-button__icon"
            ></lightning-icon>
            <span class="slds-assistive-text">Close modal</span>
          </button>
          <h2
            id="modal-heading"
            class="slds-modal__title slds-text-heading_medium"
          >
            {modalTitle}
          </h2>
        </header>
        <div
          class="slds-modal__content slds-var-p-around_medium"
          id="modal-content"
        >
          <div class="slds-form slds-form_stacked">
            <div class="slds-form-element slds-var-m-bottom_medium">
              <lightning-input
                label={labels.IEF_Integration_Code}
                value={editRecord.integrationCode}
                disabled
                readonly
              >
              </lightning-input>
            </div>
            <div class="slds-form-element slds-var-m-bottom_medium">
              <lightning-input
                label={labels.IEF_Label_Display_Name}
                value={editRecord.label}
                onchange={handleLabelChange}
                placeholder={labels.IEF_Label_Placeholder}
                required
              >
              </lightning-input>
            </div>
            <div class="slds-form-element slds-var-m-bottom_medium">
              <lightning-input
                label={labels.IEF_Group}
                value={editRecord.groupName}
                onchange={handleGroupChange}
                placeholder={labels.IEF_Group_Placeholder}
              >
              </lightning-input>
            </div>
            <div class="slds-form-element slds-var-m-bottom_medium">
              <lightning-combobox
                label={labels.IEF_Direction}
                value={editRecord.direction}
                options={directionOptions}
                onchange={handleDirectionChange}
              >
              </lightning-combobox>
            </div>
            <div class="slds-form-element slds-var-m-bottom_medium">
              <lightning-input
                label={labels.IEF_Transport}
                value={editRecord.transport}
                onchange={handleTransportChange}
                placeholder={labels.IEF_Transport_Placeholder}
              >
              </lightning-input>
            </div>
            <div class="slds-form-element slds-var-m-bottom_medium">
              <lightning-input
                type="checkbox"
                label={labels.IEF_Enabled_Kill_Switch}
                checked={editRecord.isEnabled}
                onchange={handleEnabledChange}
              >
              </lightning-input>
              <div class="slds-form-element__help">
                {labels.IEF_Enabled_Help}
              </div>
            </div>
          </div>
        </div>
        <footer class="slds-modal__footer">
          <lightning-button
            label={labels.IEF_Cancel}
            onclick={handleCloseModal}
            class="slds-var-m-right_x-small"
          >
          </lightning-button>
          <lightning-button
            variant="brand"
            label={saveButtonLabel}
            onclick={handleSaveRegistration}
            disabled={isLoading}
          >
          </lightning-button>
        </footer>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
</template>
