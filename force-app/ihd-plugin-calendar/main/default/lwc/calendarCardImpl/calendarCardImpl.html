<template>
  <lightning-card title={cardTitle}>
    <!-- Loading state -->
    <template if:true={isLoading}>
      <div class="slds-p-around_medium">
        <c-ihd-skeleton-card variant="calendar"></c-ihd-skeleton-card>
      </div>
    </template>

    <!-- Error state -->
    <template if:true={hasError}>
      <div class="slds-text-color_error slds-p-around_medium">
        <p>{errorMessage}</p>
      </div>
    </template>

    <!-- Data loaded - render the calendar -->
    <template if:false={isLoading}>
      <template if:true={hasValidContext}>
        <div class="calendar-container">
          <!-- Navigation header -->
          <div class="slds-grid slds-grid_align-spread slds-p-around_small">
            <div class="slds-col slds-grow-none">
              <lightning-button-group>
                <lightning-button
                  label="Previous"
                  icon-name="utility:left"
                  onclick={handlePrevious}
                  aria-label="Previous month"
                ></lightning-button>
                <lightning-button
                  label="Today"
                  onclick={handleToday}
                  aria-label="Go to today"
                ></lightning-button>
                <lightning-button
                  label="Next"
                  icon-name="utility:right"
                  icon-position="right"
                  onclick={handleNext}
                  aria-label="Next month"
                ></lightning-button>
              </lightning-button-group>
            </div>
            <div
              class="slds-col slds-text-align_center slds-align_absolute-center"
            >
              <h2 class="slds-text-heading_medium">{currentMonthYear}</h2>
            </div>
            <div class="slds-col slds-grow-none">
              <lightning-button-group>
                <lightning-button
                  label="Month"
                  variant={monthViewVariant}
                  onclick={handleMonthView}
                  aria-label="Month view"
                ></lightning-button>
                <lightning-button
                  label="Week"
                  variant={weekViewVariant}
                  onclick={handleWeekView}
                  aria-label="Week view"
                ></lightning-button>
              </lightning-button-group>
            </div>
          </div>

          <!-- Calendar grid -->
          <c-calendar-grid
            current-view={currentView}
            navigation-date={navigationDate}
            selected-date={selectedDate}
            daily-counts-map={dailyCountsMap}
            integration-breakdown-map={integrationBreakdownMap}
            ondayclick={handleDayClick}
          ></c-calendar-grid>
        </div>
      </template>

      <!-- Empty state -->
      <template if:false={hasValidContext}>
        <div class="slds-p-around_medium slds-text-color_weak">
          <p>Invalid context data received</p>
        </div>
      </template>
    </template>
  </lightning-card>
</template>
