<template>
  <div
    class={cellClass}
    role="gridcell"
    aria-label={ariaLabel}
    tabindex="0"
    onclick={handleClick}
    onkeydown={handleKeyDown}
  >
    <div class="day-number">{dayData.dayNumber}</div>
    <template if:true={hasData}>
      <div class="day-counts">
        <!-- Error Badge with Popover -->
        <template if:true={dayData.counts.errorCount}>
          <div class="popover-wrapper">
            <span class="count-badge error">
              <lightning-icon
                icon-name="utility:error"
                size="xx-small"
                variant="inverse"
                alternative-text="Errors"
              ></lightning-icon>
              {dayData.counts.errorCount}
            </span>
            <div
              class="slds-popover slds-popover--tooltip slds-nubbin--left popover-container popover-error"
              role="tooltip"
            >
              <div class="slds-popover__body">
                <div class="popover-header">
                  <lightning-icon
                    icon-name="utility:error"
                    size="small"
                    class="popover-icon"
                  ></lightning-icon>
                  <span class="popover-title"
                    >Errors: {dayData.counts.errorCount}</span
                  >
                </div>
                <ul class="popover-list">
                  <li class="popover-item" if:true={dayData.counts.errorCount}>
                    {dayData.counts.errorCount} error logs
                  </li>
                  <li
                    class="popover-item"
                    if:true={dayData.counts.warningCount}
                  >
                    {dayData.counts.warningCount} warnings
                  </li>
                  <li
                    class="popover-item"
                    if:true={dayData.counts.successCount}
                  >
                    {dayData.counts.successCount} success
                  </li>
                  <li class="popover-item" if:true={dayData.counts.infoCount}>
                    {dayData.counts.infoCount} info
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </template>

        <!-- Warning Badge with Popover -->
        <template if:true={dayData.counts.warningCount}>
          <div class="popover-wrapper">
            <span class="count-badge warning">
              <lightning-icon
                icon-name="utility:warning"
                size="xx-small"
                variant="inverse"
                alternative-text="Warnings"
              ></lightning-icon>
              {dayData.counts.warningCount}
            </span>
            <div
              class="slds-popover slds-popover--tooltip slds-nubbin--left popover-container popover-warning"
              role="tooltip"
            >
              <div class="slds-popover__body">
                <div class="popover-header">
                  <lightning-icon
                    icon-name="utility:warning"
                    size="small"
                    class="popover-icon"
                  ></lightning-icon>
                  <span class="popover-title"
                    >Warnings: {dayData.counts.warningCount}</span
                  >
                </div>
                <ul class="popover-list">
                  <li class="popover-item" if:true={dayData.counts.errorCount}>
                    {dayData.counts.errorCount} errors
                  </li>
                  <li
                    class="popover-item"
                    if:true={dayData.counts.warningCount}
                  >
                    {dayData.counts.warningCount} warning logs
                  </li>
                  <li
                    class="popover-item"
                    if:true={dayData.counts.successCount}
                  >
                    {dayData.counts.successCount} success
                  </li>
                  <li class="popover-item" if:true={dayData.counts.infoCount}>
                    {dayData.counts.infoCount} info
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </template>

        <!-- Success Badge with Popover -->
        <template if:true={dayData.counts.successCount}>
          <div class="popover-wrapper">
            <span class="count-badge success">
              <lightning-icon
                icon-name="utility:success"
                size="xx-small"
                variant="inverse"
                alternative-text="Success"
              ></lightning-icon>
              {dayData.counts.successCount}
            </span>
            <div
              class="slds-popover slds-popover--tooltip slds-nubbin--left popover-container popover-success"
              role="tooltip"
            >
              <div class="slds-popover__body">
                <div class="popover-header">
                  <lightning-icon
                    icon-name="utility:success"
                    size="small"
                    class="popover-icon"
                  ></lightning-icon>
                  <span class="popover-title"
                    >Success: {dayData.counts.successCount}</span
                  >
                </div>
                <ul class="popover-list">
                  <li
                    class="popover-item"
                    if:true={dayData.counts.successCount}
                  >
                    {dayData.counts.successCount} success logs
                  </li>
                  <li
                    class="popover-item"
                    if:true={dayData.counts.warningCount}
                  >
                    {dayData.counts.warningCount} warnings
                  </li>
                  <li class="popover-item" if:true={dayData.counts.infoCount}>
                    {dayData.counts.infoCount} info
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </template>

        <!-- Info Badge with Popover -->
        <template if:true={dayData.counts.infoCount}>
          <div class="popover-wrapper">
            <span class="count-badge info">
              <lightning-icon
                icon-name="utility:info"
                size="xx-small"
                variant="inverse"
                alternative-text="Info"
              ></lightning-icon>
              {dayData.counts.infoCount}
            </span>
            <div
              class="slds-popover slds-popover--tooltip slds-nubbin--left popover-container popover-info"
              role="tooltip"
            >
              <div class="slds-popover__body">
                <div class="popover-header">
                  <lightning-icon
                    icon-name="utility:info"
                    size="small"
                    class="popover-icon"
                  ></lightning-icon>
                  <span class="popover-title"
                    >Info: {dayData.counts.infoCount}</span
                  >
                </div>
                <ul class="popover-list">
                  <li class="popover-item" if:true={dayData.counts.infoCount}>
                    {dayData.counts.infoCount} info logs
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </template>
      </div>
      <div class="total-count">{dayData.counts.totalCount} total</div>
    </template>
  </div>
</template>
