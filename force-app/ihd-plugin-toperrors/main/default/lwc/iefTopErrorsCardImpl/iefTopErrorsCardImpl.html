<template>
  <lightning-card title={cardTitle}>
    <!-- Loading state -->
    <template if:true={isLoading}>
      <lightning-spinner
        alternative-text="Loading top errors"
        size="small"
      ></lightning-spinner>
    </template>

    <!-- Error state -->
    <template if:true={hasError}>
      <div class="slds-text-color_error slds-p-around_medium">
        <p>{errorMessage}</p>
      </div>
    </template>

    <!-- Ready state -->
    <template if:true={hasValidContext}>
      <div class="slds-p-around_medium">
        <p class="slds-text-body_regular">
          Top Errors card loaded with context: {parsedContext.pluginName}
        </p>
      </div>
    </template>
  </lightning-card>
</template>
